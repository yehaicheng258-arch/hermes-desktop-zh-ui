name: release

# 发版这件事全交给这里：
#   - 打 v* tag → 自动建 Release，并把 dist/plugin.js 挂成资产
#   - 推送 main  → 补齐历史上漏发的 tag
#   - 发布说明：仓库里的 docs/releases/<tag>.md 优先，没有就自动生成（Generate release notes）
#   - 已存在的 Release 会用同一份说明文件「同步一次」，所以改说明只需改文件再推 main
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整的 tag 历史

      - name: Publish / sync releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          for tag in $(git tag --list 'v*' --sort=creatordate); do
            notes_file="docs/releases/$tag.md"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "== $tag: release exists"
              if [ -f "$notes_file" ]; then
                echo "   syncing notes from $notes_file"
                gh release edit "$tag" --notes-file "$notes_file"
              fi
              if [ -f dist/plugin.js ]; then
                if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'plugin.js'; then
                  echo "   asset plugin.js already attached"
                else
                  echo "   uploading dist/plugin.js"
                  gh release upload "$tag" "dist/plugin.js#plugin.js"
                fi
              fi
              continue
            fi

            subject="$(git tag -l --format='%(contents:subject)' "$tag" | head -n1)"
            [ -n "$subject" ] || subject="$tag"
            echo "== $tag: creating release — $subject"

            args=(--title "$subject" --verify-tag)
            if [ -f "$notes_file" ]; then
              args+=(--notes-file "$notes_file")
            else
              args+=(--generate-notes)
            fi
            if [ "$tag" = "$latest_tag" ]; then
              args+=(--latest)
            fi
            if [ -f dist/plugin.js ]; then
              gh release create "$tag" "${args[@]}" "dist/plugin.js#plugin.js"
            else
              gh release create "$tag" "${args[@]}"
            fi
          done
